<!-- css.html — Stylesheet untuk KP4 Web App -->
<style>
/* ─── Google Fonts ─────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

/* ─── CSS Variables ─────────────────────────────────────────── */
:root {
  --bg-primary:    #0a0f1e;
  --bg-secondary:  #0f172a;
  --bg-card:       #111827;
  --bg-card-hover: #1a2234;
  --border:        rgba(255,255,255,0.07);
  --border-active: rgba(212,160,23,0.4);

  --gold:      #d4a017;
  --gold-light:#f0c040;
  --gold-dim:  rgba(212,160,23,0.15);

  --green:     #10b981;
  --green-dim: rgba(16,185,129,0.15);
  --red:       #ef4444;
  --red-dim:   rgba(239,68,68,0.15);
  --blue:      #3b82f6;
  --blue-dim:  rgba(59,130,246,0.15);
  --yellow:    #f59e0b;
  --yellow-dim:rgba(245,158,11,0.15);

  --text-primary:   #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted:     #475569;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
  --shadow-glow: 0 0 24px rgba(212,160,23,0.15);
}

/* ─── Reset & Base ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ─── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ─── Header ────────────────────────────────────────────────── */
.app-header {
  background: linear-gradient(135deg, #0f172a 0%, #1a2642 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-md);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 16px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--gold), #b8860b);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 2px 8px rgba(212,160,23,0.3);
}

.brand-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.brand-subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
  display: block;
  margin-top: 1px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ─── Main Layout ────────────────────────────────────────────── */
.app-main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 32px 48px;
}

/* ─── Sections ───────────────────────────────────────────────── */
.section {
  margin-bottom: 24px;
}

.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* ─── Config Panel ───────────────────────────────────────────── */
.config-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}

.config-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

.config-label {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-weight: 500;
}

.config-input {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  padding: 7px 12px;
  font-size: 13px;
  font-family: inherit;
  transition: border-color 0.2s;
  width: 140px;
}

.config-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-dim);
}

.year-badge {
  background: var(--gold-dim);
  border: 1px solid var(--border-active);
  color: var(--gold-light);
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  min-width: 70px;
  text-align: center;
}

.config-divider {
  width: 1px;
  height: 32px;
  background: var(--border);
}

/* ─── Stats Grid ─────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  cursor: default;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}

.stat-card.total::before   { background: linear-gradient(90deg, var(--blue), transparent); }
.stat-card.success::before { background: linear-gradient(90deg, var(--green), transparent); }
.stat-card.error::before   { background: linear-gradient(90deg, var(--red), transparent); }
.stat-card.pending::before { background: linear-gradient(90deg, var(--yellow), transparent); }

.stat-card:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.12); }

.stat-value {
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-card.total .stat-value   { color: var(--blue); }
.stat-card.success .stat-value { color: var(--green); }
.stat-card.error .stat-value   { color: var(--red); }
.stat-card.pending .stat-value { color: var(--yellow); }

.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ─── Toolbar ────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 240px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 15px;
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  padding: 9px 12px 9px 38px;
  font-size: 13px;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-dim);
}

.search-input::placeholder { color: var(--text-muted); }

/* ─── Buttons ────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  text-decoration: none;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold), #b8860b);
  color: #000;
  box-shadow: 0 2px 8px rgba(212,160,23,0.25);
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  box-shadow: 0 4px 12px rgba(212,160,23,0.35);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-card-hover);
  border-color: rgba(255,255,255,0.12);
}

.btn-success {
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid rgba(16,185,129,0.2);
}
.btn-success:hover:not(:disabled) { background: rgba(16,185,129,0.25); }

.btn-danger {
  background: var(--red-dim);
  color: var(--red);
  border: 1px solid rgba(239,68,68,0.2);
}
.btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.25); }

.btn-blue {
  background: var(--blue-dim);
  color: var(--blue);
  border: 1px solid rgba(59,130,246,0.2);
}
.btn-blue:hover:not(:disabled) { background: rgba(59,130,246,0.25); }

.btn-sm {
  padding: 5px 10px;
  font-size: 11px;
  gap: 4px;
}

/* ─── Progress Bar ───────────────────────────────────────────── */
.progress-container {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 16px;
}

.progress-container.visible { display: block; }

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.progress-text { font-size: 13px; color: var(--text-secondary); }
.progress-count { font-size: 13px; font-weight: 600; color: var(--gold-light); }

.progress-bar-wrap {
  background: var(--bg-secondary);
  border-radius: 999px;
  height: 6px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--green));
  border-radius: 999px;
  width: 0%;
  transition: width 0.4s ease;
}

/* ─── Table ──────────────────────────────────────────────────── */
.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table thead th {
  padding: 12px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.data-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}

.data-table tbody tr:last-child { border-bottom: none; }
.data-table tbody tr:hover { background: rgba(255,255,255,0.02); }

.data-table tbody td {
  padding: 12px 16px;
  font-size: 13px;
  vertical-align: middle;
}

.td-no { color: var(--text-muted); width: 50px; }
.td-nip { font-family: 'Courier New', monospace; font-size: 12px; color: var(--text-secondary); }
.td-nama { font-weight: 500; max-width: 220px; }
.td-jabatan { color: var(--text-secondary); font-size: 12px; max-width: 200px; }

/* ─── Status Badge ───────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.badge-success { background: var(--green-dim); color: var(--green); }
.badge-error   { background: var(--red-dim);   color: var(--red); }
.badge-pending { background: var(--yellow-dim); color: var(--yellow); }
.badge-skip    { background: var(--blue-dim);   color: var(--blue); }
.badge-none    { background: rgba(255,255,255,0.06); color: var(--text-muted); }

/* ─── Action Buttons in Table ────────────────────────────────── */
.action-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* ─── Modal ──────────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 28px 32px;
  max-width: 460px;
  width: 90%;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.2s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 8px;
}

.modal-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.6;
}

.modal-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.modal-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
}

.modal-option:hover { border-color: var(--gold); background: var(--bg-card-hover); }

.modal-option input[type=radio] { accent-color: var(--gold); }

.modal-option-label { font-size: 13px; font-weight: 500; }
.modal-option-desc  { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.modal-footer {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

/* ─── Toast Notification ─────────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text-primary);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: all;
  animation: toastIn 0.25s ease;
  max-width: 360px;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }
.toast.info    { border-left: 3px solid var(--blue); }
.toast.warning { border-left: 3px solid var(--yellow); }

/* ─── Loading Spinner ────────────────────────────────────────── */
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Empty State ────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
}

.empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
.empty-state-text { font-size: 14px; }

/* ─── Loading Overlay ────────────────────────────────────────── */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,15,30,0.85);
  backdrop-filter: blur(4px);
  z-index: 500;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}

.loading-overlay.visible { display: flex; }
.loading-text { font-size: 15px; color: var(--text-secondary); }

/* ─── Log Panel ──────────────────────────────────────────────── */
.log-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  font-size: 12px;
  font-family: 'Courier New', monospace;
  color: var(--text-secondary);
  max-height: 160px;
  overflow-y: auto;
  line-height: 1.8;
}

.log-entry { margin-bottom: 2px; }
.log-entry.success { color: var(--green); }
.log-entry.error   { color: var(--red); }
.log-entry.info    { color: var(--blue); }
.log-entry.skip    { color: var(--text-muted); }

/* ─── Responsive ─────────────────────────────────────────────── */
@media (max-width: 768px) {
  .app-main { padding: 16px; }
  .config-panel { flex-direction: column; align-items: flex-start; }
  .data-table .td-jabatan { display: none; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .toolbar { flex-direction: column; align-items: stretch; }
}

/* ─── Utility ────────────────────────────────────────────────── */
.flex { display: flex; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }
.ml-auto { margin-left: auto; }
.text-muted { color: var(--text-muted); }
.text-gold  { color: var(--gold-light); }
.font-mono  { font-family: 'Courier New', monospace; }
.truncate   { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
